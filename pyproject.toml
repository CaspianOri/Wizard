[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wizard-audit"
version = "0.1.0"
description = "Audit-first Solidity security analysis and reporting tool"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CaspianOri" }]
license = { text = "MIT" }
keywords = ["solidity", "security", "smart-contracts", "audit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# dev dependencies are intentionally thin and explicit.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
weaponized-poc-generator = "wizard_audit.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
src = ["wizard_audit"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
